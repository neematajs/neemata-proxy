[package]
name = "neemata-proxy"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["async", "tokio_rt", "napi4"] }
napi-derive = "3.0.0"
async-trait = "0.1"
pingora = { version = "0.9.0", features = ["lb", "proxy"] }
http = "1.0"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
arc-swap = "1.7"
url = "2.5.7"
log = "0.4.28"
env_logger = "0.11.8"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "router"
harness = false

[profile.release]
lto   = true
strip = "symbols"
